name = "AnalysisC"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AnalysisC", "report"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.29.0"

[[lean_lib]]
name = "AnalysisC"

[[lean_exe]]
name = "report"
root = "Main"
